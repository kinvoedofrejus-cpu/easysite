1name = "kinvos-hub"
main = "worker.js"
compatibility_date = "2024-09-23"

# Sert les fichiers statiques du dossier "public" (index.html, manifest.json,
# sw.js, icônes, admin/index.html). Toute requête qui correspond à un fichier
# existant y est servie automatiquement ; le reste passe par worker.js.
[assets]
directory = "./public"
binding = "ASSETS"

# Stockage des licences générées après achat (visible dans /admin).
[[kv_namespaces]]
binding = "LICENCES"
id = "07b95af572d449d4afd0ae5d7f3f5c4b"

# Comptes clients (téléphone + code choisi) et leurs sessions/achats.
[[kv_namespaces]]
binding = "COMPTES"
id = "ea76f4a3024c4d56b85cc6b856238e60"

# Mot de passe de l'espace admin, à définir avec :
# npx wrangler secret put ADMIN_PASSWORD
# Ne JAMAIS écrire le vrai mot de passe ici en clair.
