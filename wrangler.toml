name = "kinvos-hub"
main = "worker.js"
compatibility_date = "2024-09-23"

# Sert les fichiers statiques du dossier "public" (index.html, manifest.json,
# sw.js, icônes, admin/index.html). Toute requête qui correspond à un fichier
# existant y est servie automatiquement ; le reste passe par worker.js.
[assets]
directory = "./public"
binding = "ASSETS"

# Stockage des licences générées après achat (visible dans /admin).
# Remplace "PLACEHOLDER_KV_ID" par l'ID réel après avoir créé le namespace :
#   npx wrangler kv namespace create LICENCES
[[kv_namespaces]]
binding = "LICENCES"
id = "PLACEHOLDER_KV_ID"

# Comptes clients (téléphone + code choisi), leurs sessions/achats, et les
# messages reçus depuis le formulaire "Nous contacter" (préfixe "msg:") :
#   npx wrangler kv namespace create COMPTES
[[kv_namespaces]]
binding = "COMPTES"
id = "PLACEHOLDER_KV_ID_COMPTES"

# Mot de passe de l'espace admin, à définir avec :
#   npx wrangler secret put ADMIN_PASSWORD
# Ne JAMAIS écrire le vrai mot de passe ici en clair.

# Envoi automatique des messages du formulaire "Nous contacter" directement
# sur le WhatsApp de KINVOS GROUP, via l'API WhatsApp Business Cloud (Meta) :
#   1. Crée un compte WhatsApp Business Platform sur business.facebook.com
#      et rattache le numéro +229 66 66 18 46 (ou un numéro dédié).
#   2. Récupère le "Phone number ID" et un jeton d'accès permanent.
#   3. npx wrangler secret put WHATSAPP_TOKEN
#      npx wrangler secret put WHATSAPP_PHONE_ID
# Tant que ces secrets ne sont pas définis, les messages restent quand même
# enregistrés et consultables dans l'onglet "Messages" de /admin/.
